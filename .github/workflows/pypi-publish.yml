name: PyPI publish

# Fires on version tags (vX.Y.Z) pushed to the public CEmM2 mirror. The private
# source repo carries this file too, but the repository guard below keeps it
# inert there; only CEmM2/zotero-summarizer is registered with PyPI.
#
# Trusted publishing (OIDC): no API tokens. PyPI's publisher for this project
# is bound to (CEmM2, zotero-summarizer, pypi-publish.yml, environment pypi),
# and the `pypi` environment only accepts v* tags and waits for approval.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'CEmM2/zotero-summarizer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: plugin_dev
      - name: Test before publishing
        run: |
          uv sync --dev
          uv run pytest tests/ -q \
            --deselect tests/regression/test_redigest_cli.py::TestRedigestCli::test_all_pipeline_includes_redigest_before_publish
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata and README rendering
        run: uvx twine check --strict dist/*
      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/zsum --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/zotero-summarizer/
    permissions:
      id-token: write  # OIDC token for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub release for this tag
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create GitHub release with the published files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "zotero-summarizer ${GITHUB_REF_NAME#v}" \
            --generate-notes --verify-tag
